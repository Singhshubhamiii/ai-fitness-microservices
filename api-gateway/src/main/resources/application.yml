server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: users
          uri: lb://user-service
          predicates: [Path=/users/**]
          filters: [StripPrefix=1]
        - id: activities
          uri: lb://activity-service
          predicates: [Path=/activities/**]
          filters: [StripPrefix=1]
        - id: recommendations
          uri: lb://ai-service
          predicates: [Path=/recommendations/**]
          filters: [StripPrefix=1]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/fitness}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
